<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lihat Mata Kuliah yang Diambil</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">

  <!-- Navbar -->
  <div class="bg-blue-600 text-white p-4">
    <div class="flex justify-between items-center">
      <h1 class="text-lg font-semibold">Mata Kuliah yang Diambil</h1>
      <button onclick="logout()" class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700">Logout</button>
    </div>
  </div>

  <div class="container mx-auto my-8">
    <h2 class="text-2xl font-semibold text-center mb-6">Mata Kuliah yang Telah Diambil</h2>
    <div id="matkul-list" class="space-y-4">
  
    </div>
  </div>

  <script>
    const pembelajar = JSON.parse(localStorage.getItem('pembelajar'));
    

    function logout() {
      localStorage.removeItem('pembelajar'); 
      window.location.href = 'index.html'; 
    }

    async function fetchTakenMatkul() {
      try {
          const url = `http://localhost:5000/pembelajar/logs/${pembelajar}`;
          const response = await fetch(url);
          const data = await response.json();

  
          if (response.status === 200) {
              const matkulList = document.getElementById('matkul-list');
              if (Array.isArray(data.logs) && data.logs.length > 0) {
                  data.logs.forEach(item => {
                      const matkulItem = document.createElement('div');
                      matkulItem.classList.add('bg-white', 'p-4', 'rounded', 'shadow-md');
                      matkulItem.innerHTML = `
                          <h3 class="text-xl font-semibold">${console.log(data), item.nama}</h3>
                          <p class="text-gray-600">Deskripsi: ${item.deskripsi}</p>
                      `;
                      matkulList.appendChild(matkulItem);
                  });
              } else {
                  console.warn('Tidak ada mata kuliah yang ditemukan.');
                  matkulList.innerHTML = '<p class="text-gray-600">Tidak ada mata kuliah yang diambil.</p>';
              }
          } else {
              console.error('Gagal mengambil data mata kuliah yang diambil:', data.error);
          }
      } catch (error) {
          console.error('Terjadi kesalahan saat mengambil data mata kuliah yang diambil:', error);
      }
  }
    fetchTakenMatkul();
  </script>

</body>
</html>

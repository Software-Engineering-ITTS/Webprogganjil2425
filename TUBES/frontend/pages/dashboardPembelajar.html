<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Pembelajar</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50">

    <!-- bar pembelajar -->
    <div class="bg-green-600 text-white w-64 p-6 fixed h-screen">
        <h2 class="text-2xl font-semibold mb-4">Bar Pembelajar!</h2>
        <div class="mt-6">
            <a href="ambilMatkul.html" class="block p-2 text-lg hover:bg-green-700">Input Matkul</a>
            <a href="viewMatkul.html" class="block p-2 text-lg hover:bg-green-700">View Matkul yang Diambil</a>
            <a href="viewAllMatkulMHS.html" class="block p-2 text-lg hover:bg-green-700">View All Matkul</a>
            <button id="logoutButton"
                class="block w-full mt-6 p-2 text-lg bg-red-600 hover:bg-red-700 text-white">Logout</button>
        </div>
    </div>

    <div class="ml-64 p-8">
        <h2 class="text-3xl font-semibold text-center mb-6">Selamat Datang Pembelajar!</h2>
    </div>

    <script>
        const pembelajar = JSON.parse(localStorage.getItem('pembelajar'));



        function logout() {
            localStorage.removeItem('pembelajar');
            window.location.href = 'index.html'; 
        }

        
        function navigateTo(page) {
            if (page === 'ambilMatkul') {
                window.location.href = 'ambilMatkul.html'; 
            } else if (page === 'viewAllMatkul') {
                window.location.href = 'viewAllMatkul.html'; 
            } else if (page === 'viewMatkul') {
                window.location.href = 'viewMatkul.html'; 
            }
        }

        document.getElementById('logoutButton').addEventListener('click', () => {
            localStorage.removeItem('pembelajar');
            localStorage.removeItem('isLoggedIn');
            window.location.href = 'loginPembelajar.html';
        });
    </script>

</body>

</html>

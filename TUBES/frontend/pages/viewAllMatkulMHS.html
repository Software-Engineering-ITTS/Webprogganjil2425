<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lihat Semua Mata Kuliah</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50">

  <!-- bar pembelajar -->
  <div class="bg-green-600 text-white w-64 p-6 fixed h-screen">
    <h2 class="text-2xl font-semibold mb-4">Bar Pembelajar!</h2>
    <div class="mt-6">
      <a href="ambilMatkul.html" class="block p-2 text-lg hover:bg-green-700">Input Matkul</a>
      <a href="viewMatkul.html" class="block p-2 text-lg hover:bg-green-700">View Matkul yang Diambil</a>
      <a href="viewAllMatkulMHS.html" class="block p-2 text-lg hover:bg-green-700">View All Matkul</a>
      <button id="logoutButton"
        class="block w-full mt-6 p-2 text-lg bg-red-600 hover:bg-red-700 text-white">Logout</button>
    </div>
  </div>

  <div class="ml-64 p-8">
    <h2 class="text-2xl font-semibold text-center mb-6">Daftar Semua Mata Kuliah</h2>
    <div id="matkul-list" class="space-y-4">
    </div>
  </div>

  <script>
    document.getElementById('logoutButton').addEventListener('click', () => {
      localStorage.removeItem('pembelajar');
      window.location.href = 'index.html'; 
    });

    async function fetchAllMatkul() {
      try {
        const response = await fetch('http://localhost:5000/pengajar/viewMK');
        const data = await response.json();

        if (response.status === 200 && data.matkul && Array.isArray(data.matkul)) {
          const matkulList = document.getElementById('matkul-list');
          matkulList.innerHTML = ''; 

          data.matkul.forEach(item => {
            const matkulItem = document.createElement('div');
            matkulItem.classList.add('bg-white', 'p-4', 'rounded', 'shadow-md');
            matkulItem.innerHTML = `
              <h3 class="text-xl font-semibold">${item.name}</h3>
              <p class="text-gray-600">Deskripsi: ${item.description || 'Tidak ada deskripsi'}</p>
            `;
            matkulList.appendChild(matkulItem);
          });
        } else {
          console.error('Gagal mengambil data mata kuliah:', data.error || 'Respons tidak sesuai format.');
        }
      } catch (error) {
        console.error('Terjadi kesalahan saat mengambil data mata kuliah:', error);
      }
    }

    fetchAllMatkul();
  </script>

</body>

</html>

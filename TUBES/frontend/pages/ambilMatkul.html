<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ambil Mata Kuliah</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center h-screen">
  <div class="bg-white p-8 rounded shadow-md w-full max-w-md">
    <h2 class="text-2xl font-semibold text-gray-700 mb-4">Ambil Mata Kuliah</h2>
    
    <!-- Pilih Mata Kuliah -->
    <select id="matkulSelect" class="w-full px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-green-500 mb-4">
      <option value="">Pilih Mata Kuliah</option>
      <!-- Opsi mata kuliah akan diisi oleh JavaScript -->
    </select>

    <button id="ambilMatkulBtn" class="w-full bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700" onclick="ambilMatkul()">Ambil Mata Kuliah</button>
    <p id="message" class="mt-4 text-gray-600"></p>
    
    <!-- Kembali ke Dashboard -->
    <a href="dashboardPembelajar.html" class="block mt-4 text-center text-blue-600 hover:underline">Kembali ke Dashboard</a>
  </div>

  <script>
    // Fungsi untuk memuat mata kuliah yang tersedia
    async function loadMatkulOptions() {
      try {
        const response = await fetch('http://localhost:5000/pembelajar/viewMatkul');
        const data = await response.json();

        if (data.success) {
          const matkulSelect = document.getElementById('matkulSelect');
          data.matkul.forEach(matkul => {
            const option = document.createElement('option');
            option.value = matkul.id;
            option.textContent = matkul.nama;
            matkulSelect.appendChild(option);
          });
        } else {
          console.error('Gagal mengambil data mata kuliah');
        }
      } catch (error) {
        console.error('Terjadi kesalahan saat memuat mata kuliah:', error);
      }
    }

    // Memanggil loadMatkulOptions saat halaman dimuat
    loadMatkulOptions();

    // Fungsi untuk mengirimkan request ambil mata kuliah
    async function ambilMatkul() {
      const matkulSelect = document.getElementById('matkulSelect');
      const selectedMatkulId = matkulSelect.value;

      if (!selectedMatkulId) {
        document.getElementById('message').textContent = 'Silakan pilih mata kuliah terlebih dahulu.';
        return;
      }

      const pembelajarId = '123';  // ID Pembelajar harus diambil dari sesi atau login
      const url = `http://localhost:5000/pembelajar/${pembelajarId}/inputMatkul`;

      try {
        const response = await fetch(url, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ idMatkul: selectedMatkulId })
        });
        const data = await response.json();

        if (data.success) {
          document.getElementById('message').textContent = 'Mata kuliah berhasil diambil!';
        } else {
          document.getElementById('message').textContent = 'Gagal mengambil mata kuliah.';
        }
      } catch (error) {
        console.error('Terjadi kesalahan saat mengambil mata kuliah:', error);
        document.getElementById('message').textContent = 'Terjadi kesalahan saat mengambil mata kuliah.';
      }
    }
  </script>
</body>
</html>

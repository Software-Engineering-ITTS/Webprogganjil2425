<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ambil Mata Kuliah</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50">

  <!-- bar pembelahar -->
  <div class="bg-green-600 text-white w-64 p-6 fixed h-screen">
    <h2 class="text-2xl font-semibold mb-4">Bar Pembelajar!</h2>
    <div class="mt-6">
      <a href="ambilMatkul.html" class="block p-2 text-lg hover:bg-green-700">Input Matkul</a>
      <a href="viewMatkul.html" class="block p-2 text-lg hover:bg-green-700">View Matkul yang Diambil</a>
      <a href="viewAllMatkulMHS.html" class="block p-2 text-lg hover:bg-green-700">View All Matkul</a>
      <button id="logoutButton" class="block w-full mt-6 p-2 text-lg bg-red-600 hover:bg-red-700 text-white">Logout</button>
    </div>
  </div>
  
  <!-- Main  -->
  <div class="ml-64 p-8">
    <div class="bg-white p-8 rounded shadow-md max-w-md">
      <h2 class="text-2xl font-semibold text-gray-700 mb-4">Ambil Mata Kuliah</h2>

      <!-- Dropdown mk -->
      <select id="matkulSelect" class="w-full px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-green-500 mb-4">
        <option value="">Pilih Mata Kuliah</option>
      </select>

      <button id="ambilMatkulBtn" class="w-full bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700" onclick="ambilMatkul()">Ambil Mata Kuliah</button>
      
      <p id="message" class="mt-4 text-gray-600"></p>
    </div>
  </div>

  <script>
    async function loadMatkulOptions() {
      try {
        const response = await fetch('http://localhost:5000/pengajar/viewMK');
        const data = await response.json();
        console.log('Response:', data); // Debugging: Lihat response dari backend

        if (response.ok) {
          const matkulSelect = document.getElementById('matkulSelect');
          data.matkul.forEach(matkul => { 
            const option = document.createElement('option');
            option.value = matkul.id;
            option.textContent = matkul.name;
            matkulSelect.appendChild(option);
          });
        } else {
          console.error('Gagal mengambil data mata kuliah:', data.error);
        }
      } catch (error) {
        console.error('Terjadi kesalahan saat memuat mata kuliah:', error);
      }
    }

    async function ambilMatkul() {
      const matkulSelect = document.getElementById('matkulSelect');
      const selectedMatkulId = matkulSelect.value;

      if (!selectedMatkulId) {
        document.getElementById('message').textContent = 'Silakan pilih mata kuliah terlebih dahulu.';
        return;
      }

      const pembelajarId = '1';  url = `http://localhost:5000/pembelajar/${pembelajarId}/inputMatkul`;

      try {
        const response = await fetch(url, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ idMatkul: selectedMatkulId })
        });
        const data = await response.json();

        if (response.ok) { 
          document.getElementById('message').textContent = 'Mata kuliah berhasil diambil!';
        } else {
          document.getElementById('message').textContent = 'Gagal mengambil mata kuliah: ' + (data.error || 'Tidak ada pesan error');
        }
      } catch (error) {
        console.error('Terjadi kesalahan saat mengambil mata kuliah:', error);
        document.getElementById('message').textContent = 'Terjadi kesalahan saat mengambil mata kuliah.';
      }
    }

    document.getElementById('logoutButton').addEventListener('click', () => {
      localStorage.removeItem('pembelajarData');
      localStorage.removeItem('isLoggedIn');

      window.location.href = 'loginPembelajar.html';
    });

    loadMatkulOptions();
  </script>
</body>

</html>

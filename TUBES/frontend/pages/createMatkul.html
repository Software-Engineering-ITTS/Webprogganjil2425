<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Matkul</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 h-screen">

  <div class="flex">
    <!-- bar pengajar -->
    <div class="bg-green-600 text-white w-64 p-6">
      <h2 class="text-2xl font-semibold">Dashboard Pengajar</h2>
      <div class="mt-4">
        <a href="createMatkul.html" class="block p-2 text-lg hover:bg-green-700">Create Matkul</a>
        <a href="updateMatkul.html" class="block p-2 text-lg hover:bg-green-700">Update Matkul</a>
        <a href="viewAllMatkul.html" class="block p-2 text-lg hover:bg-green-700">View All Matkul</a>
        <a href="deleteMatkul.html" class="block p-2 text-lg hover:bg-green-700">Delete Matkul</a>
        <button id="logoutButton" class="block w-full mt-4 p-2 text-lg bg-red-600 hover:bg-red-700 text-white">Logout</button>
      </div>
    </div>

    <div class="flex-1 p-8">
      <h1 class="text-3xl font-semibold text-gray-800">Buat Mata Kuliah</h1>
      <form id="createMatkulForm" class="mt-4">
        <div class="mb-4">
          <label for="matkulName" class="block text-lg font-semibold">Nama Mata Kuliah</label>
          <input type="text" id="matkulName" class="w-full px-4 py-2 border rounded mt-2" required>
        </div>
        <div class="mb-4">
          <label for="matkulDesc" class="block text-lg font-semibold">Deskripsi Mata Kuliah</label>
          <textarea id="matkulDesc" class="w-full px-4 py-2 border rounded mt-2" required></textarea>
        </div>
        <button type="submit" class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700">Buat Mata Kuliah</button>
      </form>
    </div>
  </div>

  <script>
    document.getElementById('createMatkulForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        console.log("terbuat ges");
    
        const matkulName = document.getElementById('matkulName').value;
        const matkulDesc = document.getElementById('matkulDesc').value;
    
        try {
            const response = await fetch(`http://localhost:5000/pengajar/addMK`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    name: matkulName,
                    description: matkulDesc
                })
            });
    
            if (!response.ok) {
                throw new Error(`HTTP error! Status: ${response.status}`);
            }
    
            const text = await response.text();
            const result = text ? JSON.parse(text) : {};
    
            console.log('Response:', result);
    
            if (result.message) {
                alert(result.message); 
                window.location.href = 'viewAllMatkul.html';
            } else {
                alert(result.error || 'Gagal membuat mata kuliah');
            }
        } catch (error) {
            console.error('Error:', error);
            alert('Terjadi kesalahan!');
        }
    });
    document.getElementById('logoutButton').addEventListener('click', () => {
      localStorage.removeItem('pengajar');
      localStorage.removeItem('isLoggedIn');
      window.location.href = 'loginPengajar.html';
    });
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Pengajar</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center h-screen">
  <form id="loginForm" class="bg-white p-8 rounded shadow-md space-y-4">
    <h2 class="text-2xl font-semibold text-gray-700">Login Pengajar</h2>
    <input type="email" id="email" placeholder="Email" class="w-full px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-green-500">
    <input type="password" id="pass" placeholder="Password" class="w-full px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-green-500">
    <button type="submit" class="w-full bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">Login</button>
  </form>

  <div class="mt-4 text-center">
    <button onclick="window.location.href='index.html'" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Kembali ke Homepage</button>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async function(event) {
      event.preventDefault(); 

      const email = document.getElementById('email').value;
      const pass = document.getElementById('pass').value;

      try {
        const response = await fetch('http://localhost:5000/pengajar/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ email, pass }),
        });

        const result = await response.json();  // ngambil response dalam format JSON

        if (response.status === 200) {
            // data pengajar nyimpen di localStorage
            localStorage.setItem('pengajar', JSON.stringify(result.data)); 
            localStorage.setItem('isLoggedIn', 'true'); 
        
            alert('Login berhasil!');
            window.location.href = 'dashboardPengajar.html';  
        } else {
          alert('Login gagal: ' + result.error);
        }
      } catch (error) {
        console.error('Error during login:', error);
        alert('Terjadi kesalahan saat login.');
      }
    });
  </script>
</body>
</html>

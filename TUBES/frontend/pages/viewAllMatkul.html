<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lihat Semua Mata Kuliah</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">

  <!-- Navbar -->
  <div class="bg-blue-600 text-white p-4">
    <div class="flex justify-between items-center">
      <h1 class="text-lg font-semibold">Lihat Semua Mata Kuliah</h1>
      <button onclick="logout()" class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700">Logout</button>
    </div>
  </div>

  <div class="container mx-auto my-8">
    <h2 class="text-2xl font-semibold text-center mb-6">Daftar Semua Mata Kuliah</h2>
    <div id="matkul-list" class="space-y-4">
      <!-- Mata kuliah akan dimuat di sini -->
    </div>
  </div>

  <script>
    

    // Fungsi logout
    function logout() {
      localStorage.removeItem('pembelajar'); 
      window.location.href = 'index.html'; // Kembali ke halaman login
    }

    async function fetchAllMatkul() {
        try {
            const response = await fetch('http://localhost:5000/pengajar/viewMK');
            const data = await response.json();
    
            if (response.status === 200 && data.matkul) { // Pastikan `data.matkul` ada
                const matkulList = document.getElementById('matkul-list');
                matkulList.innerHTML = ''; // Kosongkan list sebelum menambahkan data baru
    
                data.matkul.forEach(item => {
                    const matkulItem = document.createElement('div');
                    matkulItem.classList.add('bg-white', 'p-4', 'rounded', 'shadow-md');
                    matkulItem.innerHTML = `
                        <h3 class="text-xl font-semibold">${item.name}</h3>
                        <p class="text-gray-600">Deskripsi: ${item.description  }</p>
                    `;
                    matkulList.appendChild(matkulItem);
                });
            } else {
                console.error('Gagal mengambil data mata kuliah:', data.error);
            }
        } catch (error) {
            console.error('Terjadi kesalahan saat mengambil data mata kuliah:', error);
        }
    }
    
    // Memanggil fungsi fetchAllMatkul untuk mendapatkan semua mata kuliah
    fetchAllMatkul();
  </script>

</body>
</html>

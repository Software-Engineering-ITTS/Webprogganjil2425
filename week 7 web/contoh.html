<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaji Karyawan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <div class="container-fluid p-5" style="background-color: aqua;">
        <div class="row mb-4">
            <div class="col text-center">
                <h1 class="text-light bg-dark py-3">Gaji Karyawan</h1>
            </div>
        </div>
        
        <form id="salaryForm" class="bg-white p-4 rounded shadow-sm">
            <!-- Personal Information -->
            <div class="mb-3">
                <label for="Username" class="form-label">Username</label>
                <input type="text" id="Username" name="Username" class="form-control">
            </div>
            <div class="mb-3">
                <label for="pwd" class="form-label">Password</label>
                <input type="password" id="pwd" name="pwd" class="form-control">
            </div>
            <div class="mb-3">
                <label class="form-label">Nama</label>
                <input type="text" class="form-control">
            </div>
            <div class="mb-3">
                <label class="form-label">Tanggal</label>
                <input type="text" class="form-control">
            </div>
            <div class="mb-3">
                <label class="form-label">Gender</label><br>
                <div class="form-check form-check-inline">
                    <input type="radio" id="male" name="Gender" class="form-check-input">
                    <label for="male" class="form-check-label">Laki laki</label>
                </div>
                <div class="form-check form-check-inline">
                    <input type="radio" id="female" name="Gender" class="form-check-input">
                    <label for="female" class="form-check-label">Perempuan</label>
                </div>
            </div>
            <!-- Job Position -->
            <div class="mb-3">
                <label class="form-label">Jabatan</label>
                <div class="dropdown">
                    <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                        Pilih Jabatan
                    </button>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="#">CEO</a></li>
                        <li><a class="dropdown-item" href="#">Direktur</a></li>
                        <li><a class="dropdown-item" href="#">Manager</a></li>
                        <li><a class="dropdown-item" href="#">Karyawan</a></li>
                        <li><a class="dropdown-item" href="#">OB</a></li>
                    </ul>
                </div>
            </div>
            <!-- Vehicles -->
            <div class="mb-3">
                <label class="form-label">Kendaraan</label><br>
                <div class="form-check">
                    <input type="checkbox" id="vehicle1" name="vehicle1" value="Bike" class="form-check-input">
                    <label for="vehicle1" class="form-check-label">Mobil</label>
                </div>
                <div class="form-check">
                    <input type="checkbox" id="vehicle2" name="vehicle2" value="Car" class="form-check-input">
                    <label for="vehicle2" class="form-check-label">Motor</label>
                </div>
                <div class="form-check">
                    <input type="checkbox" id="vehicle3" name="vehicle3" value="Boat" class="form-check-input">
                    <label for="vehicle3" class="form-check-label">Sepeda</label>
                </div>
            </div>
            <!-- Payroll Calculation Section -->
            <h3 class="mt-4">Perhitungan Gaji</h3>
            <div class="mb-3">
                <label for="basicSalary" class="form-label">Gaji Pokok</label>
                <input type="number" id="basicSalary" name="basicSalary" class="form-control">
            </div>
            <div class="mb-3">
                <label for="attendance" class="form-label">Jumlah Kehadiran (hari)</label>
                <input type="number" id="attendance" name="attendance" class="form-control">
            </div>
            <div class="mb-3">
                <label for="allowance" class="form-label">Tunjangan</label>
                <input type="number" id="allowance" name="allowance" class="form-control">
            </div>
            <div class="mb-3">
                <label for="deduction" class="form-label">Potongan</label>
                <input type="number" id="deduction" name="deduction" class="form-control">
            </div>
            <div class="mb-3">
                <label for="floatingTextarea" class="form-label">Note</label>
                <textarea class="form-control" placeholder="Leave a comment here" id="floatingTextarea"></textarea>
            </div>
            <div class="text-center">
                <button type="button" class="btn btn-primary" onclick="calculateSalary()">Hitung Gaji</button>
            </div>
            <div class="mt-3">
                <h4>Total Gaji: <span id="totalSalary">Rp 0</span></h4>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script>
        function calculateSalary() {
            const basicSalary = parseFloat(document.getElementById('basicSalary').value) || 0;
            const attendance = parseInt(document.getElementById('attendance').value) || 0;
            const allowance = parseFloat(document.getElementById('allowance').value) || 0;
            const deduction = parseFloat(document.getElementById('deduction').value) || 0;

            
            const dailyRate = basicSalary / 30;
            const attendancePay = dailyRate * attendance;

            
            const totalSalary = attendancePay + allowance - deduction;
            document.getElementById('totalSalary').innerText = 'Rp ' + totalSalary.toLocaleString();
        }
    </script>
</body>
</html>
